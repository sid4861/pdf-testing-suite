<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compare — pair pages</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./proof.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2346C8}a:hover{color:#1A36A0}
</style>
</helmet>
<div class="ps">
<header class="hdr">
<div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="2.5" width="11" height="15" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.75"/><rect x="9.5" y="6.5" width="11" height="15" rx="1.5" fill="currentColor"/></svg>pdfsuite</div>
<nav class="wtabs" aria-label="Workspaces">
<a class="wtab on" href="Compare-SideBySide.dc.html" aria-current="page">Compare</a>
<a class="wtab" href="Spec-Results.dc.html">Specification</a>
<a class="wtab" href="Inspect.dc.html">Inspect</a>
</nav>
</header>
<div style="flex: 1; background: #EFEFEB"></div>

<div class="scrim">
<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="pp-title" style="width: 1040px; max-height: 100%">
<div class="dialog-hd">
<div class="stack" style="gap: 2px">
<h2 class="h3" id="pp-title">Pair pages</h2>
<span class="small faint">Choose which page each golden page is compared with. Nothing is guessed.</span>
</div>
<span class="spacer"></span>
<a class="btn btn-g btn-i" href="Compare-SideBySide.dc.html" aria-label="Close without applying (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
</div>

<div style="display: flex; flex-wrap: wrap; min-height: 0">
<div style="flex: 1 1 420px; min-width: 0; border-right: 1px solid #E2E2DD">
<div class="row" style="padding: 10px 20px; border-bottom: 1px solid #E2E2DD; gap: 12px">
<span class="role role-g" style="width: 120px; text-align: center">Golden · 6</span>
<span style="width: 24px"></span>
<span class="role" style="width: 120px; text-align: center">To test · 5</span>
</div>
<div class="divide">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div class="row" style="padding: 10px 20px; gap: 12px; background: {{r.bg}}">
<button class="row" type="button" style="width: 120px; gap: 10px; border: 1px solid #E2E2DD; background: #fff; border-radius: 6px; padding: 6px 8px; cursor: pointer" aria-label="Golden page {{r.a}}">
<span style="width: 26px; aspect-ratio: 8.5/11; background: #fff; box-shadow: 0 0 0 1px #CBCBC5; display: block"></span>
<span class="mono small">p. {{r.a}}</span>
</button>
<span class="faint mono" aria-hidden="true">↔</span>
<sc-if value="{{r.none}}" hint-placeholder-val="{{false}}">
<button class="row" type="button" style="width: 120px; gap: 8px; border: 1px dashed #B42318; background: #FBE9E7; color: #B42318; border-radius: 6px; padding: 6px 8px; height: 50px; cursor: pointer; font: 500 12px/1.2 var(--sans)">No matching page</button>
</sc-if>
<sc-if value="{{r.has}}" hint-placeholder-val="{{true}}">
<button class="row" type="button" style="width: 120px; gap: 10px; border: {{r.border}}; background: #fff; border-radius: 6px; padding: 6px 8px; cursor: pointer" aria-label="Page to test {{r.b}}">
<span style="width: 26px; aspect-ratio: 8.5/11; background: #fff; box-shadow: 0 0 0 1px #CBCBC5; display: block"></span>
<span class="mono small">p. {{r.b}}</span>
</button>
</sc-if>
<span class="xs faint" style="flex: 1">{{r.note}}</span>
<button class="btn btn-sm btn-g btn-i" type="button" aria-label="Remove this pair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
</sc-for>
</div>
</div>

<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column">
<div class="row" style="padding: 10px 16px; border-bottom: 1px solid #E2E2DD; gap: 10px">
<span class="h4">Golden p. 5 is compared with…</span>
<span class="spacer"></span>
<button class="btn btn-sm btn-g btn-i" type="button" aria-label="Smaller pages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg></button>
<button class="btn btn-sm btn-g btn-i" type="button" aria-label="Bigger pages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></button>
</div>
<div style="padding: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; background: #F6F6F4; flex: 1">
<sc-for list="{{picks}}" as="p" hint-placeholder-count="5">
<button type="button" style="display: flex; flex-direction: column; gap: 6px; align-items: center; background: none; border: 0; padding: 0; cursor: pointer">
<span style="width: 100%; aspect-ratio: {{p.ratio}}; background: #fff; display: block; box-shadow: {{p.ring}}; position: relative"></span>
<span class="mono xs" style="color: {{p.color}}">p. {{p.n}}{{p.tag}}</span>
</button>
</sc-for>
<button type="button" style="display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center; background: none; border: 1.5px dashed #CBCBC5; border-radius: 6px; padding: 10px; cursor: pointer; color: #45484F; font: 500 12px/1.3 var(--sans)">No matching page</button>
</div>
</div>
</div>

<div class="dialog-ft">
<div class="banner b-warn" style="padding: 6px 10px; font-size: 12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/></svg><span>Page 4 to test appears in two pairs — it will be compared twice.</span></div>
<span class="spacer"></span>
<button class="btn btn-g" type="button">Revert to page by page</button>
<a class="btn" href="Compare-SideBySide.dc.html">Cancel</a>
<a class="btn btn-p" href="Compare-SideBySide.dc.html">Apply pairing</a>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [
      { a: 1, b: 1, note: '' },
      { a: 2, b: 2, note: '' },
      { a: 3, b: null, note: 'Removed in the PDF to test' },
      { a: 4, b: 3, note: '' },
      { a: 5, b: 4, note: 'Choosing…', sel: true },
      { a: 6, b: 4, note: 'Also used by golden p. 5', dup: true }
    ].map(function (r) {
      return {
        a: r.a, b: r.b, note: r.note, none: r.b === null, has: r.b !== null,
        bg: r.sel ? '#EBEEFB' : 'transparent',
        border: r.sel ? '2px solid #2346C8' : (r.dup ? '1px solid #C46A00' : '1px solid #E2E2DD')
      };
    });
    var picks = [1, 2, 3, 4, 5].map(function (n) {
      return {
        n: n,
        ratio: n === 5 ? '11/8.5' : '8.5/11',
        ring: n === 4 ? '0 0 0 2px #2346C8' : '0 0 0 1px #CBCBC5',
        color: n === 4 ? '#1A36A0' : '#45484F',
        tag: n === 4 ? ' · selected' : (n === 3 ? ' · in use' : '')
      };
    });
    return { rows: rows, picks: picks };
  }
}
</script>
</body>
</html>
